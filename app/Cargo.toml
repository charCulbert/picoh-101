[package]
name = "picoh-app"
version = "0.1.0"
edition = "2021"
description = "PICOH-101: the synth's page, reaching the Pico over its USB cable (MIDI SysEx) or Wi-Fi, on macOS and iOS"

[lib]
name = "picoh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tungstenite = "0.30"

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation-sys = "0.8"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
